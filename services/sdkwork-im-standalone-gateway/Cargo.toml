[package]
name = "sdkwork-im-standalone-gateway"
edition.workspace = true
license.workspace = true
version.workspace = true
description = "Sdkwork IM standalone gateway embedding IAM and application ingress on one bind."

[[bin]]
name = "sdkwork-im-standalone-gateway"
path = "src/main.rs"

[dependencies]
axum.workspace = true
sdkwork-api-config = { path = "../../crates/sdkwork-api-config" }
sdkwork-api-product-runtime = { path = "../../crates/sdkwork-api-product-runtime" }
sdkwork-im-cloud-gateway-config = { path = "../../crates/sdkwork-im-cloud-gateway-config" }
sdkwork-im-cloud-gateway-observability = { path = "../../crates/sdkwork-im-cloud-gateway-observability" }
sdkwork-im-web-bootstrap = { path = "../../crates/sdkwork-im-web-bootstrap" }
sdkwork-im-cloud-gateway = { workspace = true }
web_gateway = { package = "sdkwork-im-cloud-gateway", path = "../sdkwork-im-cloud-gateway" }
sdkwork_routes_iam_app_api = { workspace = true }
sdkwork_im_service_readiness = { workspace = true }
sdkwork_im_database_pool = { workspace = true }
sdkwork_iam_database_host = { workspace = true }
sdkwork_im_iam_application_bootstrap = { workspace = true }
im-adapters-postgres-journal = { path = "../../adapters/postgres-journal" }
sdkwork-api-im-assembly = { path = "../../crates/sdkwork-api-im-assembly" }
social-service = { path = "../social-service" }
conversation_runtime = { path = "../sdkwork-comms-conversation-service", package = "sdkwork-comms-conversation-service" }
session-gateway = { path = "../session-gateway" }
sdkwork-drive-gateway-assembly = { workspace = true }
sdkwork-notary-gateway-assembly = { workspace = true }
sdkwork-course-gateway-assembly = { workspace = true }
sdkwork-drive-config = { workspace = true }
sdkwork-drive-security = { workspace = true }
sdkwork-drive-workspace-service = { workspace = true }
sdkwork-knowledgebase-database-host = { workspace = true }
sdkwork-knowledgebase-gateway-assembly = { workspace = true }
sdkwork-webstore-database-host = { workspace = true }
sdkwork-mail-database-host = { workspace = true }
sdkwork-mail-gateway-assembly = { workspace = true }
sdkwork-notary-database-host = { workspace = true }
sdkwork-course-database-host = { workspace = true }
sdkwork-agents-gateway-assembly = { workspace = true }
sdkwork-agents-runtime-facade.workspace = true
sdkwork-api-account-assembly = { workspace = true }
sdkwork-account-service-host = { workspace = true }
sdkwork-catalog-gateway-assembly = { workspace = true }
sdkwork-catalog-service-host = { workspace = true }
sdkwork-inventory-gateway-assembly = { workspace = true }
sdkwork-inventory-service-host = { workspace = true }
sdkwork-invoice-gateway-assembly = { workspace = true }
sdkwork-invoice-service-host = { workspace = true }
sdkwork-membership-gateway-assembly = { workspace = true }
sdkwork-membership-service-host = { workspace = true }
sdkwork-merchandise-gateway-assembly = { workspace = true }
sdkwork-merchandise-service-host = { workspace = true }
sdkwork-order-gateway-assembly = { workspace = true }
sdkwork-order-service-host = { workspace = true }
sdkwork-payment-gateway-assembly = { workspace = true }
sdkwork-payment-service-host = { workspace = true }
sdkwork-promotion-gateway-assembly = { workspace = true }
sdkwork-promotion-service-host = { workspace = true }
sdkwork-shop-gateway-assembly = { workspace = true }
sdkwork-shop-service-host = { workspace = true }
sdkwork-iam-embedded-application-bootstrap = { workspace = true }
sdkwork_database_config = { workspace = true }
sdkwork_database_sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "net", "signal"] }
toml = "0.8"
tower-http = { version = "0.6.6", features = ["cors"] }
sdkwork_web_axum.workspace = true
sdkwork_web_core.workspace = true
tracing.workspace = true

[dev-dependencies]
futures-util.workspace = true
session-gateway = { path = "../session-gateway" }
sdkwork-routes-im-realtime-open-api = { path = "../../crates/sdkwork-routes-im-realtime-open-api" }
tokio-tungstenite = "0.28.0"
