syntax = "proto3";

package sdkwork.communication.internal.v1;

import "sdkwork/common/v1/context.proto";

option java_multiple_files = true;
option java_package = "com.sdkwork.communication.internal.v1";
option go_package = "github.com/sdkwork/im-rpc-sdk-go/generated/proto/sdkwork/communication/internal/v1;communicationinternalv1";

service RoomOrchestrationService {
  rpc CreateRoom(CreateRoomRequest) returns (CreateRoomResponse);
  rpc RetrieveRoom(RetrieveRoomRequest) returns (RetrieveRoomResponse);
  rpc EnterRoom(EnterRoomRequest) returns (EnterRoomResponse);
  rpc LeaveRoom(LeaveRoomRequest) returns (LeaveRoomResponse);
}

message OrchestratedRoomView {
  string room_id = 1;
  string room_kind = 2;
  string conversation_id = 3;
  int32 active_member_count = 4;
  int32 max_members = 5;
}

message CreateRoomRequest {
  string tenant_id = 1;
  string organization_id = 2;
  string actor_id = 3;
  string actor_kind = 4;
  string conversation_id = 5;
  string room_id = 6;
  string room_kind = 7;
  sdkwork.common.v1.RequestMetadata metadata = 15;
}

message CreateRoomResponse {
  string conversation_id = 1;
  string event_id = 2;
  OrchestratedRoomView room = 3;
  sdkwork.common.v1.ResponseMetadata metadata = 15;
}

message RetrieveRoomRequest {
  string tenant_id = 1;
  string organization_id = 2;
  string room_id = 3;
  sdkwork.common.v1.RequestMetadata metadata = 15;
}

message RetrieveRoomResponse {
  OrchestratedRoomView room = 1;
  sdkwork.common.v1.ResponseMetadata metadata = 15;
}

message EnterRoomRequest {
  string tenant_id = 1;
  string organization_id = 2;
  string room_id = 3;
  string principal_id = 4;
  string principal_kind = 5;
  sdkwork.common.v1.RequestMetadata metadata = 15;
}

message EnterRoomResponse {
  string member_id = 1;
  string conversation_id = 2;
  sdkwork.common.v1.ResponseMetadata metadata = 15;
}

message LeaveRoomRequest {
  string tenant_id = 1;
  string organization_id = 2;
  string room_id = 3;
  string principal_id = 4;
  string principal_kind = 5;
  sdkwork.common.v1.RequestMetadata metadata = 15;
}

message LeaveRoomResponse {
  string member_id = 1;
  string conversation_id = 2;
  string status = 3;
  sdkwork.common.v1.ResponseMetadata metadata = 15;
}
