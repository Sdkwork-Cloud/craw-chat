[package]
name = "sdkwork-api-im-standalone-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Canonical standalone HTTP gateway for the SDKWork IM application API assembly."

[[bin]]
name = "sdkwork-api-im-standalone-gateway"
path = "src/main.rs"

[dependencies]
axum.workspace = true
sdkwork-api-im-assembly.workspace = true
sdkwork-web-bootstrap.workspace = true
sdkwork-api-config.workspace = true
sdkwork-api-product-runtime.workspace = true
sdkwork-im-web-bootstrap.workspace = true
sdkwork-api-iam-assembly = { workspace = true }
sdkwork_iam_web_adapter.workspace = true
sdkwork_im_service_readiness = { workspace = true }
sdkwork_im_database_pool = { workspace = true }
sdkwork_iam_database_host = { workspace = true }
sdkwork_im_iam_application_bootstrap = { workspace = true }
im-adapters-postgres-journal = { path = "../../adapters/postgres-journal" }
social-service = { path = "../../services/social-service" }
conversation_runtime = { path = "../../services/sdkwork-comms-conversation-service", package = "sdkwork-comms-conversation-service" }
session-gateway = { path = "../../services/session-gateway" }
sdkwork-api-drive-assembly = { workspace = true }
sdkwork-api-notary-assembly = { workspace = true }
sdkwork-api-course-assembly = { workspace = true }
sdkwork-drive-config = { workspace = true }
sdkwork-drive-security = { workspace = true }
sdkwork-drive-workspace-service = { workspace = true }
sdkwork-knowledgebase-database-host = { workspace = true }
sdkwork-api-knowledgebase-assembly = { workspace = true }
sdkwork-webstore-database-host = { workspace = true }
sdkwork-mail-database-host = { workspace = true }
sdkwork-api-mail-assembly = { workspace = true }
sdkwork-notary-database-host = { workspace = true }
sdkwork-course-database-host = { workspace = true }
sdkwork-api-agents-assembly = { workspace = true }
sdkwork-agents-runtime-facade.workspace = true
sdkwork-api-account-assembly = { workspace = true }
sdkwork-account-service-host = { workspace = true }
sdkwork-api-catalog-assembly = { workspace = true }
sdkwork-catalog-service-host = { workspace = true }
sdkwork-api-inventory-assembly = { workspace = true }
sdkwork-inventory-service-host = { workspace = true }
sdkwork-api-invoice-assembly = { workspace = true }
sdkwork-invoice-service-host = { workspace = true }
sdkwork-api-membership-assembly = { workspace = true }
sdkwork-membership-service-host = { workspace = true }
sdkwork-api-merchandise-assembly = { workspace = true }
sdkwork-merchandise-service-host = { workspace = true }
sdkwork-api-order-assembly = { workspace = true }
sdkwork-order-service-host = { workspace = true }
sdkwork-api-payment-assembly = { workspace = true }
sdkwork-payment-service-host = { workspace = true }
sdkwork-api-promotion-assembly = { workspace = true }
sdkwork-promotion-service-host = { workspace = true }
sdkwork-api-shop-assembly = { workspace = true }
sdkwork-shop-service-host = { workspace = true }
sdkwork-iam-embedded-application-bootstrap = { workspace = true }
sdkwork_database_config = { workspace = true }
sdkwork_database_sqlx = { workspace = true }
sdkwork_web_axum.workspace = true
sdkwork_web_core.workspace = true
tokio = { version = "1.48", features = ["rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.6.6", features = ["cors"] }
tracing.workspace = true
