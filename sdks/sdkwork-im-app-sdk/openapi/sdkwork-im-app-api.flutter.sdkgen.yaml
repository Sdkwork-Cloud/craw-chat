components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
    AuthToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
    AccessToken:
      type: apiKey
      in: header
      name: Access-Token
  parameters:
    StreamIdPath:
      name: streamId
      in: path
      required: true
      schema:
        type: string
    ExecutionIdPath:
      in: path
      name: executionId
      required: true
      schema:
        type: string
    NotificationIdPath:
      in: path
      name: notificationId
      required: true
      schema:
        type: string
    ToolCallIdPath:
      in: path
      name: toolCallId
      required: true
      schema:
        type: string
    ConversationIdPath:
      in: path
      name: conversationId
      required: true
      schema:
        type: string
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: Client retry key scoped by the authenticated tenant, principal, method, and conversation path.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: ^[A-Za-z0-9._:-]+$
  responses:
    BadRequestError:
      description: Request validation failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    UnauthorizedError:
      description: Bearer authentication failed or is missing
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ForbiddenError:
      description: Caller is not allowed to access the resource
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFoundError:
      description: Resource was not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ConflictError:
      description: Request conflicts with the current resource state
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ServiceUnavailableError:
      description: Required runtime capability or provider is unavailable
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  schemas:
    CreateGroupKnowledgebaseRequest:
      type: object
      additionalProperties: false
      description: >-
        Explicit command input. Group identity, tenancy, membership, and initial space metadata are authoritative IM
        state and are never client supplied.
    LaunchGroupKnowledgebaseRequest:
      type: object
      additionalProperties: false
      description: >-
        Explicit command input. The response ticket is scoped to the authenticated group member and is consumed once by
        sdkwork-knowledgebase.
    ArchiveGroupConversationRequest:
      type: object
      additionalProperties: false
      description: >-
        Explicit command input. The group target and archive actor are derived from the authenticated request context
        and path and cannot be supplied by the caller.
    GroupKnowledgebaseLinkView:
      type: object
      additionalProperties: false
      required:
        - conversationId
        - lifecycleState
        - membershipEpoch
        - upstreamLinkGeneration
      properties:
        conversationId:
          type: string
        spaceId:
          type: string
          format: int64
          pattern: ^[0-9]+$
          x-sdkwork-int64-string: true
          x-sdkwork-rust-type: i64
        spaceUuid:
          type: string
        lifecycleState:
          type: string
          enum:
            - absent
            - provisioning
            - active
            - failed
            - archived
            - deleted
        provisioningOperationId:
          type: string
        membershipEpoch:
          type: string
          format: int64
          pattern: ^[0-9]+$
          x-sdkwork-int64-string: true
          x-sdkwork-rust-type: u64
        upstreamLinkGeneration:
          type: string
          format: int64
          pattern: ^[0-9]+$
          x-sdkwork-int64-string: true
          x-sdkwork-rust-type: u64
        lastErrorCode:
          type: string
    GroupKnowledgebaseLaunchResponse:
      type: object
      additionalProperties: false
      required:
        - conversationId
        - lifecycleState
        - membershipEpoch
        - upstreamLinkGeneration
      properties:
        conversationId:
          type: string
        lifecycleState:
          type: string
          enum:
            - absent
            - provisioning
            - active
            - failed
            - archived
            - deleted
        spaceId:
          type: string
          format: int64
          pattern: ^[0-9]+$
          x-sdkwork-int64-string: true
          x-sdkwork-rust-type: i64
        spaceUuid:
          type: string
        launchTicket:
          type: string
          description: Opaque one-time ticket consumed only by sdkwork-knowledgebase through IM internal RPC.
          x-sdkwork-sensitive: true
        expiresAt:
          type: string
          format: date-time
        membershipEpoch:
          type: string
          format: int64
          pattern: ^[0-9]+$
          x-sdkwork-int64-string: true
          x-sdkwork-rust-type: u64
        upstreamLinkGeneration:
          type: string
          format: int64
          pattern: ^[0-9]+$
          x-sdkwork-int64-string: true
          x-sdkwork-rust-type: u64
        provisioningOperationId:
          type: string
    ArchiveGroupConversationResponse:
      type: object
      additionalProperties: false
      required:
        - accepted
        - resourceId
        - status
        - archiveEventId
        - archivedAt
        - knowledgebaseArchiveScheduled
      properties:
        accepted:
          type: boolean
        resourceId:
          type: string
        status:
          type: string
        archiveEventId:
          type: string
        archivedAt:
          type: string
          format: date-time
        knowledgebaseArchiveScheduled:
          type: boolean
    PortalSnapshotMeta:
      type: object
      additionalProperties: false
      required:
        - section
        - generatedAt
        - opsStatus
      properties:
        section:
          type: string
          enum:
            - access
            - automation
            - conversations
            - dashboard
            - governance
            - home
            - media
            - realtime
        generatedAt:
          type: string
          format: date-time
        opsStatus:
          type: string
          enum:
            - ok
            - idle
            - degraded
            - unavailable
            - critical
            - unknown
    PortalDataAvailability:
      type: object
      additionalProperties: false
      required:
        - state
        - source
        - complete
      properties:
        state:
          type: string
          enum:
            - available
            - partial
            - unavailable
        source:
          type: string
        complete:
          type: boolean
        reason:
          type: string
    PortalModuleSnapshot:
      type: object
      additionalProperties: false
      required:
        - meta
        - availability
      properties:
        meta:
          $ref: '#/components/schemas/PortalSnapshotMeta'
        availability:
          $ref: '#/components/schemas/PortalDataAvailability'
    PortalOperationalMetrics:
      type: object
      additionalProperties: false
      required:
        - clientRouteWindowCount
        - pendingRealtimeEventCount
      properties:
        clientRouteWindowCount:
          type: string
          format: int64
          pattern: ^[0-9]+$
          x-sdkwork-int64-string: true
          x-sdkwork-rust-type: u64
        pendingRealtimeEventCount:
          type: string
          format: int64
          pattern: ^[0-9]+$
          x-sdkwork-int64-string: true
          x-sdkwork-rust-type: u64
    PortalDashboardSnapshot:
      type: object
      additionalProperties: false
      required:
        - meta
        - availability
