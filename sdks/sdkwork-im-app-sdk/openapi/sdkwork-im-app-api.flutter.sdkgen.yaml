        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartAgentResponseRequest'
      responses:
        '201':
          description: Agent response stream session
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SdkWorkApiResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        required:
                          - item
                        properties:
                          item:
                            $ref: '#/components/schemas/StreamSession'
        '400':
          description: Problem detail response
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Problem detail response
          content:
            application/problem+json:
