openapi: 3.1.2
info:
  title: Sdkwork IM App API
  version: 0.1.0
  description: >-
    Owner-only app-development OpenAPI contract for Sdkwork IM-owned app-business and non-management HTTP APIs.
    Dependency capabilities, including sdkwork-appbase identity/session/IAM/QR auth, are consumed through
    sdkDependencies and dependency SDKs instead of being regenerated here.
servers:
  - url: http://127.0.0.1:18079
security:
  - ApiKey: []
  - AuthToken: []
    AccessToken: []
tags:
