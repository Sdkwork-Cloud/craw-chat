# Fragment merged into sdkwork-im-im.openapi.yaml before /im/v3/api/streams.
# Paths align with services/space-service/src/http.rs (OpenAPI uses camelCase path params).
/im/v3/api/spaces:
  post:
    tags:
      - spaces
    operationId: spaces.create
    summary: Create a space
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SpaceCreateRequest'
    responses:
      '201':
        description: Created
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/SdkWorkApiResponse'
                - type: object
                  required:
                    - data
                  properties:
                    data:
                      type: object
                      required:
                        - item
                      properties:
                        item:
                          $ref: '#/components/schemas/SpaceView'
    security:
      - ApiKey: []
      - AuthToken: []
        AccessToken: []
    x-sdkwork-owner: sdkwork-im
    x-sdkwork-api-authority: sdkwork-im.im
    x-sdkwork-request-context: WebRequestContext
    x-sdkwork-api-surface: open-api
    x-sdkwork-route-auth: api-key-or-dual-token
    x-sdkwork-auth-mode: api-key-or-dual-token
  get:
    tags:
      - spaces
    operationId: spaces.list
    summary: List spaces
    parameters:
      - $ref: '#/components/parameters/PageSizeQuery'
      - $ref: '#/components/parameters/CursorQuery'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/SdkWorkApiResponse'
                - type: object
                  required:
                    - data
                  properties:
                    data:
                      type: object
                      additionalProperties: false
                      required:
                        - items
                        - pageInfo
                      properties:
                        items:
                          type: array
                          items:
                            $ref: '#/components/schemas/SpaceView'
                        pageInfo:
                          $ref: '#/components/schemas/PageInfo'
    security:
      - ApiKey: []
      - AuthToken: []
        AccessToken: []
    x-sdkwork-owner: sdkwork-im
