parameters:
  SpaceIdPath:
    name: spaceId
    in: path
    required: true
    schema:
      type: string
      pattern: '^[0-9]+$'
      x-sdkwork-int64-string: true
  GroupIdPath:
    name: groupId
    in: path
    required: true
    schema:
      type: string
      pattern: '^[0-9]+$'
      x-sdkwork-int64-string: true
  ChannelIdPath:
    name: channelId
    in: path
    required: true
    schema:
      type: string
      pattern: '^[0-9]+$'
      x-sdkwork-int64-string: true
  UserIdPath:
    name: userId
    in: path
    required: true
    schema:
      type: string
  InviteCodePath:
    name: inviteCode
    in: path
    required: true
    schema:
      type: string
    description: Invitation identifier returned by spaces.invites.create.
  RuleIdPath:
    name: ruleId
    in: path
    required: true
    schema:
      type: string
      pattern: '^[0-9]+$'
      x-sdkwork-int64-string: true
schemas:
  SpaceCreateRequest:
    type: object
    additionalProperties: false
    properties:
      spaceName:
        type: string
      spaceType:
        type: string
      description:
        type: string
        nullable: true
    required:
      - spaceName
      - spaceType
  SpaceUpdateRequest:
    type: object
    additionalProperties: false
    properties:
      spaceName:
        type: string
      description:
        type: string
        nullable: true
  SpaceView:
    type: object
    additionalProperties: false
    properties:
      spaceId:
        type: string
        pattern: '^[0-9]+$'
        x-sdkwork-int64-string: true
      spaceName:
        type: string
      spaceType:
        type: string
      ownerUserId:
        type: string
      createdAt:
        type: string
        format: date-time
    required:
      - spaceId
      - spaceName
      - spaceType
      - ownerUserId
      - createdAt
  SpaceMemberCreateRequest:
    type: object
    additionalProperties: false
    properties:
      userId:
        type: string
      role:
        type: string
    required:
      - userId
  SpaceMemberUpdateRequest:
    type: object
    additionalProperties: false
    properties:
      role:
        type: string
  SpaceMemberView:
    type: object
    additionalProperties: false
    properties:
      userId:
        type: string
      role:
        type: string
    required:
      - userId
      - role
  SpaceGroupCreateRequest:
    type: object
    additionalProperties: false
    properties:
      groupName:
        type: string
      description:
        type: string
        nullable: true
    required:
      - groupName
  SpaceGroupUpdateRequest:
    type: object
    additionalProperties: false
    properties:
      groupName:
        type: string
      description:
        type: string
        nullable: true
  SpaceGroupView:
    type: object
    additionalProperties: false
    properties:
      groupId:
        type: string
        pattern: '^[0-9]+$'
        x-sdkwork-int64-string: true
      groupName:
        type: string
    required:
      - groupId
      - groupName
  SpaceGroupMemberCreateRequest:
    type: object
    additionalProperties: false
    properties:
      userId:
        type: string
      role:
        type: string
        nullable: true
      nickname:
        type: string
        nullable: true
    required:
      - userId
  SpaceGroupMemberUpdateRequest:
    type: object
    additionalProperties: false
    properties:
      role:
        type: string
        nullable: true
      nickname:
        type: string
        nullable: true
      muteUntil:
        type: string
        format: date-time
        nullable: true
  SpaceGroupMemberView:
    type: object
    additionalProperties: false
    properties:
      userId:
        type: string
      role:
        type: string
      nickname:
        type: string
        nullable: true
      muteUntil:
        type: string
        format: date-time
        nullable: true
      joinedAt:
        type: string
        format: date-time
    required:
      - userId
      - role
      - joinedAt
  SpaceChannelCreateRequest:
    type: object
    additionalProperties: false
    properties:
      channelName:
        type: string
      channelType:
        type: string
    required:
      - channelName
      - channelType
  SpaceChannelUpdateRequest:
    type: object
    additionalProperties: false
    properties:
      channelName:
        type: string
  SpaceChannelView:
    type: object
    additionalProperties: false
    properties:
      channelId:
        type: string
        pattern: '^[0-9]+$'
        x-sdkwork-int64-string: true
      channelName:
        type: string
      channelType:
        type: string
    required:
      - channelId
      - channelName
      - channelType
  SpaceChannelAccessRuleCreateRequest:
    type: object
    additionalProperties: false
    properties:
      ruleType:
        type: string
      principalKind:
        type: string
        nullable: true
      principalId:
        type: string
        nullable: true
      permission:
        type: string
    required:
      - ruleType
      - permission
  SpaceChannelAccessRuleView:
    type: object
    additionalProperties: false
    properties:
      ruleId:
        type: string
        pattern: '^[0-9]+$'
        x-sdkwork-int64-string: true
      channelId:
        type: string
        pattern: '^[0-9]+$'
        x-sdkwork-int64-string: true
      ruleType:
        type: string
      principalKind:
        type: string
        nullable: true
      principalId:
        type: string
        nullable: true
      permission:
        type: string
      createdAt:
        type: string
        format: date-time
    required:
      - ruleId
      - channelId
      - ruleType
      - permission
      - createdAt
  SpaceInviteCreateRequest:
    type: object
    additionalProperties: false
    description: >-
      Invitation to join the space. At least one of inviteeUserId,
      inviteeEmail, or inviteePhone is required.
    properties:
      inviteeUserId:
        type: string
        description: Invitee user id when the invitation is addressed to a registered user.
      inviteeEmail:
        type: string
        description: Invitee email when the invitation is delivered by email.
      inviteePhone:
        type: string
        description: Invitee phone when the invitation is delivered by phone.
      targetType:
        type: string
        enum:
          - space
        description: Invitation target type. Only space invitations are supported.
      targetId:
        type: string
        pattern: ^[0-9]+$
        x-sdkwork-int64-string: true
        description: Invitation target id, must equal the spaceId path parameter.
      role:
        type: string
        enum:
          - admin
          - member
          - guest
        description: Role granted to the invitee on acceptance. Defaults to member.
      message:
        type: string
        nullable: true
        description: Optional personal message shown to the invitee.
      expiresAt:
        type: string
        format: date-time
        nullable: true
        description: RFC3339 expiry instant. Must be in the future when provided.
    required:
      - targetType
      - targetId
  SpaceInviteView:
    type: object
    additionalProperties: false
    properties:
      invitationId:
        type: string
        pattern: ^[0-9]+$
        x-sdkwork-int64-string: true
        description: Invitation identifier, passed as the inviteCode path parameter.
      inviterUserId:
        type: string
      inviteeUserId:
        type: string
        nullable: true
      targetType:
        type: string
      targetId:
        type: string
        pattern: ^[0-9]+$
        x-sdkwork-int64-string: true
      role:
        type: string
      status:
        type: string
        enum:
          - pending
          - accepted
          - declined
          - expired
          - canceled
      createdAt:
        type: string
        format: date-time
    required:
      - invitationId
      - inviterUserId
      - targetType
      - targetId
      - role
      - status
      - createdAt
  SpaceBanCreateRequest:
    type: object
    additionalProperties: false
    properties:
      userId:
        type: string
      reason:
        type: string
        nullable: true
    required:
      - userId
  SpaceBanView:
    type: object
    additionalProperties: false
    properties:
      userId:
        type: string
      reason:
        type: string
        nullable: true
    required:
      - userId
