apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-gateway
  namespace: sdkwork-im
  labels:
    app.kubernetes.io/name: session-gateway
    app.kubernetes.io/component: realtime
    app.kubernetes.io/part-of: sdkwork-im
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: session-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: session-gateway
        app.kubernetes.io/component: realtime
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      # session-gateway holds long-lived WebSocket connections and in-memory
      # realtime route state. Give it a generous termination grace period so
      # the preStop hook can drain connections (LB removal + client reconnect
      # backoff) before SIGTERM, and so the SIGTERM handler can flush pending
      # outbox events and persist state to PostgreSQL/Redis cleanly.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: session-gateway
          image: ghcr.io/sdkwork/session-gateway:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 18080
          envFrom:
            - configMapRef:
                name: session-gateway-runtime
            - secretRef:
                name: session-gateway-secrets
                optional: true
          env:
            - name: SDKWORK_IM_ENVIRONMENT
              value: production
            - name: SDKWORK_IM_DEPLOYMENT_PROFILE
              value: cloud
            - name: OTEL_SERVICE_NAME
              value: sdkwork-im-session-gateway
            - name: TMPDIR
              value: /tmp
          # Let the load balancer / kube-proxy remove this Pod from the
          # Service endpoints BEFORE we receive SIGTERM. Without this sleep,
          # there is a ~5-10s race window where new WebSocket connections
          # could still be routed to a terminating Pod and immediately dropped.
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
          # startupProbe lets the runtime restore per-principal realtime route
          # state from PostgreSQL before livenessProbe kicks in. Without it,
          # a slow cold start (large tenant, many subscriptions) could be
          # killed by livenessProbe before it finishes warming up.
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              # session-gateway holds DashMap-backed realtime route state,
              # per-principal mutation shards, and in-flight WebSocket
              # buffers. 512Mi was too tight for tenants with many concurrent
              # connections; 1Gi gives headroom for GC and burst traffic.
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: session-gateway
  namespace: sdkwork-im
  labels:
    app.kubernetes.io/name: session-gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: session-gateway
  ports:
    - name: http
      port: 18080
      targetPort: http
