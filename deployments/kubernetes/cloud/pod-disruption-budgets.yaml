apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: session-gateway-pdb
  namespace: sdkwork-im
spec:
  # session-gateway holds long-lived WebSocket connections; require at least 2
  # replicas available so a voluntary disruption cannot drop the realtime tier
  # to a single Pod (which would concentrate all WS connections on one node).
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: session-gateway
---
