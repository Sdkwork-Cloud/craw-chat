apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: session-gateway-hpa
  namespace: sdkwork-im
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: session-gateway
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 4
          periodSeconds: 30
    scaleDown:
      # session-gateway holds long-lived WebSocket connections; give clients a
      # generous window to reconnect / migrate before we trim replicas after a
      # traffic spike. 5 minutes matches the typical LB drain + client
      # reconnect backoff upper bound.
      stabilizationWindowSeconds: 300
      selectPolicy: Min
      policies:
        - type: Percent
          value: 25
          periodSeconds: 120
        - type: Pods
          value: 1
          periodSeconds: 120
---
