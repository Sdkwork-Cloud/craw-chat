apiVersion: v1
kind: ConfigMap
metadata:
  name: conversation-service-runtime
  namespace: sdkwork-im
data:
  SDKWORK_IM_CONVERSATION_RUNTIME_BIND_ADDR: 0.0.0.0:28082
  SDKWORK_IM_APP_CONTEXT_REQUIRE_SIGNATURE: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability.svc:4318

# The required `conversation-service-secrets` Secret must provide
# SDKWORK_IM_MESSAGE_HISTORY_CURSOR_HS256_SECRET or its `_FILE` variant with
# one shared random value across every conversation-service replica.
