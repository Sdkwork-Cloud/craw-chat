# sdkwork-im docker test domains -> container gateway.
# Windows hosts: 127.0.0.1 testimdocker.sdkwork.com testimdocker.birdcoder.com testimdocker.dtupay.com
# The gateway serves the default site for Host localhost:18079 and uses
# X-Forwarded-Host for public URL generation, so the real domain is preserved.
# Deploy as /etc/nginx/sites-enabled/testimdocker-im.conf (the `map` block is
# valid here because sites-enabled/*.conf is included from the http context),
# together with bootstrap-token.js next to it (the same-origin script the
# sub_filter below injects).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name testimdocker.sdkwork.com testimdocker.birdcoder.com testimdocker.dtupay.com;

    access_log /var/log/nginx/testimdocker-im.access.log;
    error_log /var/log/nginx/testimdocker-im.error.log;

    # Credential-entry bootstrap: the renderer reads the development bootstrap
    # Access-Token from window.__SDKWORK_CREDENTIAL_ENTRY_BOOTSTRAP_ACCESS_TOKEN__
    # (SDKWORK_ACCESS_TOKEN at vite build/serve time; production builds are
    # never pre-injected). The standalone container serves the production
    # renderer build, so the test nginx injects a script tag that loads the
    # well-known development fallback token from bootstrap-token.js.
    # An EXTERNAL same-origin script is required: the gateway CSP is
    # script-src 'self' with a per-response nonce, so inline scripts are
    # blocked. Accept-Encoding is cleared so sub_filter can rewrite the body.
    location = /bootstrap-token.js {
        alias /etc/nginx/bootstrap-token.js;
    }

    location / {
        proxy_pass http://127.0.0.1:18079;
        proxy_http_version 1.1;
        proxy_set_header Host localhost:18079;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Realtime link (WebSocket) plane rides the same ingress.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 1100m;
        proxy_set_header Accept-Encoding "";
        sub_filter_once on;
        sub_filter '</head>' '<script src="/bootstrap-token.js"></script></head>';
    }
}
