version: 1
defaultProfile: cloud.production

profiles:
  cloud.production:
    install:
      layout: binary-package
    expose:
      - domain: im.sdkwork.com
        tls: sdkwork.com
        mode: web+api
        web: adaptive
        apiPathStyle: full-prefix
    packages:
      - flutter-mobile
      - harmony-mobile
      - mini-program-weixin
      - desktop-windows
      - desktop-macos
      - desktop-linux
    overrides:
      topology:
        spec: specs/topology.spec.json
        profile: cloud.production
        env: configs/topology/cloud.production.env
      kubernetes:
        reference: deployments/kubernetes/cloud/

  standalone.development:
    install:
      layout: source-tree
    expose:
      - domain: localhost
        tls: off
        mode: web+api
        web: adaptive
        apiPathStyle: full-prefix
    packages: []
    overrides:
      topology:
        spec: specs/topology.spec.json
        profile: standalone.development
        env: configs/topology/standalone.development.env
